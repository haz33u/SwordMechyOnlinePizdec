<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Anime UI Visual Editor & Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #090b10;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* Layout Split */
    .editor-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Main Preview Canvas Area */
    .preview-canvas {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 40% 50%, #171b26 0%, #080a0f 100%);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 60px;
      overflow: hidden;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* Side Menu Container */
    .side-menu {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    /* Menu Button Base */
    .menu-btn {
      position: relative;
      width: 190px;
      height: 52px;
      border-radius: 12px;
      background: rgba(14, 17, 26, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, box-shadow 0.2s ease;
    }

    .menu-btn.active-selected {
      outline: 2px solid #38bdf8;
      outline-offset: 4px;
    }

    /* Outer Glow Layer */
    .menu-btn::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 20px;
      background: var(--glow-color);
      opacity: var(--glow-opacity, 0.35);
      filter: blur(var(--glow-blur, 14px));
      z-index: -2;
      transition: opacity 0.25s ease, filter 0.25s ease;
    }

    /* Dual Border UIStroke simulation */
    .menu-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      padding: 3px;
      background: var(--border-gradient);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 1;
      pointer-events: none;
    }

    /* Inner Dark Texture Overlay */
    .btn-texture {
      position: absolute;
      inset: 2px;
      border-radius: 10px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 0);
      background-size: 6px 6px;
      pointer-events: none;
      z-index: 0;
    }

    /* Hover & Active Effects */
    .menu-btn:hover {
      transform: scale(1.06) translateX(4px);
      background: rgba(22, 27, 40, 0.95);
    }

    .menu-btn:hover::before {
      opacity: 0.75;
      filter: blur(18px);
    }

    /* Icon Container & Styling */
    .btn-icon {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 10px;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    /* Button Text Styling */
    .btn-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      z-index: 2;
      background: var(--text-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0px #0a0824);
    }

    /* Keybind Badge Pill */
    .keybind-pill {
      margin-left: auto;
      background: rgba(26, 32, 48, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 800;
      color: #e2e8f0;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1), 0 2px 4px rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    /* Notification Alert Badge */
    .alert-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff3b5c 0%, #d91438 100%);
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px #ff1e43, 0 2px 4px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #ffffff;
      z-index: 5;
      animation: pulse-alert 1.5s infinite ease-in-out;
    }

    @keyframes pulse-alert {
      0%, 100% { transform: scale(1); box-shadow: 0 0 8px #ff1e43; }
      50% { transform: scale(1.15); box-shadow: 0 0 16px #ff1e43; }
    }

    @keyframes rainbow-spin {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .rainbow-spin {
      animation: rainbow-spin 4s linear infinite;
    }

    /* Right Control Inspector Panel */
    .inspector-panel {
      width: 420px;
      background: #0f121a;
      border-left: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
    }

    .panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid #1e293b;
      background: #131722;
    }

    .panel-header h1 {
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header p {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .panel-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
    }

    .field-group input[type="text"], .field-group select {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-group input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .color-pickers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .color-input-wrapper input[type="color"] {
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .color-input-wrapper span {
      font-size: 12px;
      color: #94a3b8;
      font-family: monospace;
    }

    /* Export Footer */
    .panel-footer {
      padding: 20px 24px;
      border-top: 1px solid #1e293b;
      background: #131722;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-export {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-export:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    /* Modal for Export Code */
    .code-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .code-modal.open {
      display: flex;
    }

    .modal-box {
      width: 680px;
      max-height: 80vh;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      padding: 16px 24px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      color: #38bdf8;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    pre {
      background: #020617;
      padding: 16px;
      border-radius: 8px;
      color: #7dd3fc;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="editor-layout">
    
    <!-- PREVIEW CANVAS -->
    <div class="preview-canvas">
      <div class="grid-bg"></div>

      <div class="side-menu" id="sideMenuContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- INSPECTOR PANEL -->
    <div class="inspector-panel">
      <div class="panel-header">
        <h1>🛠️ Roblox UI Visual Editor</h1>
        <p>Настройте меню и сгенерируйте чистый 1-в-1 Lua код для игры</p>
      </div>

      <div class="panel-content">
        <div>
          <div class="section-title">Выбор кнопки</div>
          <div class="field-group">
            <select id="btnSelector" onchange="selectButton(this.value)">
              <!-- Options populated by JS -->
            </select>
          </div>
        </div>

        <div>
          <div class="section-title">Основные свойства</div>
          <div class="field-group">
            <label>Название (Title)</label>
            <input type="text" id="inpTitle" oninput="updateCurrentButton()">
          </div>
          <div class="field-group">
            <label>Иконка (Emoji / Glyph)</label>
            <input type="text" id="inpIcon" oninput="updateCurrentButton()">
          </div>
          <div class="field-group">
            <label>Горячая клавиша (Keybind)</label>
            <input type="text" id="inpKeybind" placeholder="например H или J" oninput="updateCurrentButton()">
          </div>
          <div class="field-group" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="cursor: pointer;" for="chkAlert">Бейдж уведомления (!)</label>
            <input type="checkbox" id="chkAlert" style="width: 18px; height: 18px; cursor: pointer;" onchange="updateCurrentButton()">
          </div>
          <div class="field-group" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="cursor: pointer;" for="chkRainbow">Анимация Радуги (Rainbow Shimmer)</label>
            <input type="checkbox" id="chkRainbow" style="width: 18px; height: 18px; cursor: pointer;" onchange="updateCurrentButton()">
          </div>
        </div>

        <div>
          <div class="section-title">Цвета и Свечение</div>
          <div class="field-group">
            <label>Цвет свечения (Soft Glow)</label>
            <div class="color-input-wrapper">
              <input type="color" id="clrGlow" onchange="updateCurrentButton()">
              <span id="txtGlowHex">#ff007f</span>
            </div>
          </div>

          <div class="field-group">
            <label>Градиент рамки (Border Stroke)</label>
            <div class="color-pickers">
              <div class="color-input-wrapper">
                <input type="color" id="clrBorder1" onchange="updateCurrentButton()">
                <span id="txtBorder1Hex">#ff007f</span>
              </div>
              <div class="color-input-wrapper">
                <input type="color" id="clrBorder2" onchange="updateCurrentButton()">
                <span id="txtBorder2Hex">#7f00ff</span>
              </div>
            </div>
          </div>
        </div>

      </div>

      <div class="panel-footer">
        <button class="btn-export" onclick="openExportModal()">
          <span>🚀 Сгенерировать Roblox Luau Код (1 в 1)</span>
        </button>
      </div>
    </div>

  </div>

  <!-- EXPORT CODE MODAL -->
  <div class="code-modal" id="exportModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Готовый Luau Код для Roblox Studio</h3>
        <button class="close-btn" onclick="closeExportModal()">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">Скопируйте этот модуль и вставьте в ваш UI контроллер в игре:</p>
        <pre id="codeOutput"></pre>
      </div>
    </div>
  </div>

  <script>
    let buttonsData = [
      { id: 'store', title: 'Store', icon: '🛒', keybind: '', alert: false, rainbow: true, glow: '#ff007f', border1: '#ff007f', border2: '#7f00ff' },
      { id: 'units', title: 'Units', icon: '⭐', keybind: 'H', alert: false, rainbow: false, glow: '#ffaa00', border1: '#ffee55', border2: '#ffaa00' },
      { id: 'items', title: 'Items', icon: '🎒', keybind: 'J', alert: false, rainbow: false, glow: '#00bfff', border1: '#70e2ff', border2: '#0088ff' },
      { id: 'quests', title: 'Quests', icon: '📜', keybind: '', alert: true, rainbow: false, glow: '#ff5500', border1: '#ff9933', border2: '#e63900' },
      { id: 'summon', title: 'Summon', icon: '💎', keybind: '', alert: false, rainbow: false, glow: '#aa00ff', border1: '#e066ff', border2: '#8800cc' },
      { id: 'areas', title: 'Areas', icon: '🧭', keybind: '', alert: false, rainbow: false, glow: '#00e64d', border1: '#66ff8c', border2: '#009933' },
      { id: 'play', title: 'Play', icon: '⛵', keybind: '', alert: false, rainbow: false, glow: '#00e5cc', border1: '#66fff0', border2: '#009988' },
      { id: 'events', title: 'Events', icon: '🎉', keybind: '', alert: false, rainbow: false, glow: '#ff0055', border1: '#ff6699', border2: '#cc0044' },
    ];

    let activeId = 'store';

    function renderMenu() {
      const container = document.getElementById('sideMenuContainer');
      container.innerHTML = '';

      buttonsData.forEach(btn => {
        const div = document.createElement('div');
        div.className = `menu-btn ${btn.rainbow ? 'rainbow-spin' : ''} ${btn.id === activeId ? 'active-selected' : ''}`;
        div.style.setProperty('--glow-color', btn.glow);
        div.style.setProperty('--border-gradient', `linear-gradient(135deg, ${btn.border1}, ${btn.border2})`);
        div.style.setProperty('--text-gradient', `linear-gradient(180deg, #ffffff 0%, #ffffff 100%)`);
        div.onclick = () => selectButton(btn.id);

        let html = `
          <div class="btn-texture"></div>
          <div class="btn-icon">${btn.icon}</div>
          <span class="btn-title">${btn.title}</span>
        `;

        if (btn.keybind) {
          html += `<div class="keybind-pill">${btn.keybind}</div>`;
        }

        if (btn.alert) {
          html += `<div class="alert-badge">!</div>`;
        }

        div.innerHTML = html;
        container.appendChild(div);
      });
    }

    function populateSelector() {
      const sel = document.getElementById('btnSelector');
      sel.innerHTML = '';
      buttonsData.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id;
        opt.textContent = `${b.title} (${b.id})`;
        if (b.id === activeId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function selectButton(id) {
      activeId = id;
      populateSelector();
      const b = buttonsData.find(x => x.id === id);
      if (!b) return;

      document.getElementById('inpTitle').value = b.title;
      document.getElementById('inpIcon').value = b.icon;
      document.getElementById('inpKeybind').value = b.keybind;
      document.getElementById('chkAlert').checked = b.alert;
      document.getElementById('chkRainbow').checked = b.rainbow;

      document.getElementById('clrGlow').value = b.glow;
      document.getElementById('txtGlowHex').textContent = b.glow;

      document.getElementById('clrBorder1').value = b.border1;
      document.getElementById('txtBorder1Hex').textContent = b.border1;

      document.getElementById('clrBorder2').value = b.border2;
      document.getElementById('txtBorder2Hex').textContent = b.border2;

      renderMenu();
    }

    function updateCurrentButton() {
      const b = buttonsData.find(x => x.id === activeId);
      if (!b) return;

      b.title = document.getElementById('inpTitle').value;
      b.icon = document.getElementById('inpIcon').value;
      b.keybind = document.getElementById('inpKeybind').value;
      b.alert = document.getElementById('chkAlert').checked;
      b.rainbow = document.getElementById('chkRainbow').checked;

      b.glow = document.getElementById('clrGlow').value;
      document.getElementById('txtGlowHex').textContent = b.glow;

      b.border1 = document.getElementById('clrBorder1').value;
      document.getElementById('txtBorder1Hex').textContent = b.border1;

      b.border2 = document.getElementById('clrBorder2').value;
      document.getElementById('txtBorder2Hex').textContent = b.border2;

      renderMenu();
    }

    function hexToRgb(hex) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16);
      return `Color3.fromRGB(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255})`;
    }

    function openExportModal() {
      let code = `--!strict\n-- Auto-Generated 1-in-1 Side Menu Configuration for Roblox Studio\n\nlocal SideMenuConfig = {\n`;

      buttonsData.forEach(b => {
        code += `    { id = "${b.id}", title = "${b.title}", icon = "${b.icon}", keybind = "${b.keybind}", alert = ${b.alert}, rainbow = ${b.rainbow},\n`;
        code += `      glowColor = ${hexToRgb(b.glow)},\n`;
        code += `      borderGradient = { ${hexToRgb(b.border1)}, ${hexToRgb(b.border2)} } },\n`;
      });

      code += `}\n\nreturn SideMenuConfig`;

      document.getElementById('codeOutput').textContent = code;
      document.getElementById('exportModal').classList.add('open');
    }

    function closeExportModal() {
      document.getElementById('exportModal').classList.remove('open');
    }

    // Init
    populateSelector();
    renderMenu();
  </script>
</body>
</html>
