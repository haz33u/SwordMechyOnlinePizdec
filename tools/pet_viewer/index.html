<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Game Assets, Pets, Weapons & RBX ID Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #080a11;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f1322;
      border-bottom: 1px solid #1e293b;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* World & Category Nav */
    .nav-bar {
      display: flex;
      gap: 8px;
      background: #0b0e18;
      padding: 8px 16px;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
    }

    main {
      flex: 1;
      padding: 24px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .assets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* Asset Card with RBX Asset ID & Description */
    .asset-card {
      position: relative;
      background: #111625;
      border-radius: 14px;
      border: 1.5px solid #1e293b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .asset-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .asset-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 17px;
      color: #fff;
    }

    .category-badge {
      font-size: 10px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-sword { background: #2563eb; color: #fff; }
    .badge-pet { background: #9333ea; color: #fff; }
    .badge-mob { background: #dc2626; color: #fff; }
    .badge-frame { background: #059669; color: #fff; }

    .asset-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .rbx-id-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090c14;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 4px;
    }

    .rbx-id-text {
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
    }

    .btn-copy {
      background: #1e293b;
      color: #cbd5e1;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-copy:hover {
      background: #0284c7;
      color: #fff;
    }

    .direct-link {
      font-size: 11px;
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔍 Roblox Project Assets & RBX ID Inspector</h1>
  </header>

  <!-- CATEGORY NAV -->
  <div class="nav-bar">
    <button class="tab-btn active" onclick="filterCategory('all', this)">All Assets (Все Ассеты)</button>
    <button class="tab-btn" onclick="filterCategory('swords', this)">⚔️ Weapons & Swords (Мечи)</button>
    <button class="tab-btn" onclick="filterCategory('pets', this)">🐾 Pets & Models (Петы)</button>
    <button class="tab-btn" onclick="filterCategory('mobs', this)">🧟 Mobs & Bosses (Мобы)</button>
    <button class="tab-btn" onclick="filterCategory('frames', this)">🔲 Inventory Frames (Рамки)</button>
  </div>

  <main>
    <div class="assets-grid" id="assetsGrid">
      <!-- Populated dynamically -->
    </div>
  </main>

  <script>
    const assetsData = [
      // WEAPONS
      { name: 'Starter Weapon', type: 'swords', rbxId: 'rbxassetid://107165883488202', path: 'ReplicatedStorage.WeaponModels.Starter', desc: 'Начальный меч игрока (Локация 1).' },
      { name: 'Old Sword', type: 'swords', rbxId: 'rbxassetid://89369544061968', path: 'ReplicatedStorage.WeaponModels.OldSword', desc: 'Старый меч из кованого железа.' },
      { name: 'Double-Edged Sword', type: 'swords', rbxId: 'rbxassetid://107165883488202', path: 'ReplicatedStorage.WeaponModels.DoubleEdged', desc: 'Острый двуручный меч с Силой x17.' },
      { name: 'Ardite Greatsword', type: 'swords', rbxId: 'rbxassetid://89369544061968', path: 'ReplicatedStorage.WeaponModels.Ardite', desc: 'Легендарный ардитовый меч (Локация 1).' },
      { name: 'Forest Shadow', type: 'swords', rbxId: 'rbxassetid://107165883488202', path: 'ReplicatedStorage.WeaponModels.ForestShadow', desc: 'Секретный теневой лесной клинок.' },
      { name: 'Pirate Saber', type: 'swords', rbxId: 'rbxassetid://89369544061968', path: 'ReplicatedStorage.WeaponModels.PirateSaber', desc: 'Пиратская сабля (Локация 2).' },
      { name: 'Golden-plated Sword', type: 'swords', rbxId: 'rbxassetid://107165883488202', path: 'ReplicatedStorage.WeaponModels.GoldPlated', desc: 'Позолоченный меч со свечением.' },
      { name: 'Element Blade', type: 'swords', rbxId: 'rbxassetid://89369544061968', path: 'ReplicatedStorage.WeaponModels.Element', desc: 'Элементальный стихийный клинок.' },
      { name: 'Sea Dagger', type: 'swords', rbxId: 'rbxassetid://107165883488202', path: 'ReplicatedStorage.WeaponModels.SeaDagger', desc: 'Легендарный морской кинжал.' },
      { name: 'Aetherite Axe', type: 'swords', rbxId: 'rbxassetid://89369544061968', path: 'ReplicatedStorage.AxesFolder.Aetherite', desc: 'Тяжелый топор из эфирита.' },
      { name: 'Celestium Sword', type: 'swords', rbxId: 'rbxassetid://107165883488202', path: 'ReplicatedStorage.WeaponModels.Celestium', desc: 'Божественный селестиумовый клинок.' },

      // PETS
      { name: 'Woodling (Model A)', type: 'pets', rbxId: 'rbxassetid://81512403260701', path: 'ReplicatedStorage.PetModels.A', desc: 'Деревянный лесной дух (Common).' },
      { name: 'Lurk (Model B)', type: 'pets', rbxId: 'rbxassetid://102890033531349', path: 'ReplicatedStorage.PetModels.B', desc: 'Теневой летучий зверь (Common).' },
      { name: 'Forestling (Model C)', type: 'pets', rbxId: 'rbxassetid://74393234989307', path: 'ReplicatedStorage.PetModels.C', desc: 'Зеленый лесной слайм (Rare).' },
      { name: 'Hekata (Model D)', type: 'pets', rbxId: 'rbxassetid://113960553603442', path: 'ReplicatedStorage.PetModels.D', desc: 'Трехглазая фиолетовая сова (Rare).' },
      { name: 'Stiko (Model E)', type: 'pets', rbxId: 'rbxassetid://84765769197391', path: 'ReplicatedStorage.PetModels.E', desc: 'Золотой колючий лис (Legendary).' },
      { name: 'Charon (Model F)', type: 'pets', rbxId: 'rbxassetid://88560000877223', path: 'ReplicatedStorage.PetModels.F', desc: 'Огненный адский пес (Rare).' },
      { name: 'Morpheus (Model G)', type: 'pets', rbxId: 'rbxassetid://84603345544587', path: 'ReplicatedStorage.PetModels.G', desc: 'Сумеречная голубая бабочка (Rare).' },
      { name: 'Torn (Model 2-A)', type: 'pets', rbxId: 'rbxassetid://124036977196447', path: 'ReplicatedStorage.PetModels["2-A"]', desc: 'Фиолетовый теневой дракон (Epic).' },
      { name: 'Nifel (Model 2-B)', type: 'pets', rbxId: 'rbxassetid://81512403260701', path: 'ReplicatedStorage.PetModels["2-B"]', desc: 'Ледяной небесный змей (Epic).' },
      { name: 'Nightmare (Model 2-C)', type: 'pets', rbxId: 'rbxassetid://102890033531349', path: 'ReplicatedStorage.PetModels["2-C"]', desc: 'Огненный демон-жнец (Legendary).' },
      { name: 'Grommash (Model 2-D)', type: 'pets', rbxId: 'rbxassetid://74393234989307', path: 'ReplicatedStorage.PetModels["2-D"]', desc: 'Огромный гигантский дракон (Mythic).' },
      { name: 'Nereus (Waifu Model)', type: 'pets', rbxId: 'rbxassetid://113960553603442', path: 'ReplicatedStorage.PetModels.Waifu', desc: 'Мифическая сирена Вайфу (Mythic).' },

      // MOBS & BOSSES
      { name: 'Archer', type: 'mobs', rbxId: 'rbxassetid://77107427791922', path: 'ReplicatedStorage.NoobModels.Archer', desc: 'Зеленый эльфийский лучник (Враг).' },
      { name: 'Cooker', type: 'mobs', rbxId: 'rbxassetid://77107427791922', path: 'ReplicatedStorage.NoobModels.Cooker', desc: 'Шеф-повар монстр (Враг).' },
      { name: 'Gingerbread Man', type: 'mobs', rbxId: 'rbxassetid://77107427791922', path: 'ReplicatedStorage.MinionModels["2-D"]', desc: 'Пряничный человечек (Моб).' },
      { name: 'Anubis Guard', type: 'mobs', rbxId: 'rbxassetid://77107427791922', path: 'ReplicatedStorage.MinionModels["3-G"]', desc: 'Страж Анубиса (Моб 5-го Мира).' },
      { name: 'Blue Dragon Head', type: 'mobs', rbxId: 'rbxassetid://77107427791922', path: 'ReplicatedStorage.MinionModels["2-F"]', desc: 'Ледяной дракон Босс.' },

      // FRAMES & SLOTS
      { name: 'Slot_Common_5', type: 'frames', rbxId: 'rbxassetid://77107427791922', path: 'InventoryAssetConfig.Slot_Common_5', desc: 'Серая рамка слота инвентаря.' },
      { name: 'Slot_Rare_5', type: 'frames', rbxId: 'rbxassetid://73913709307435', path: 'InventoryAssetConfig.Slot_Rare_5', desc: 'Синяя редкая рамка слота.' },
      { name: 'Slot_Epic_5', type: 'frames', rbxId: 'rbxassetid://125802780104168', path: 'InventoryAssetConfig.Slot_Epic_5', desc: 'Фиолетовая эпическая рамка слота.' },
      { name: 'Slot_Legendary_5', type: 'frames', rbxId: 'rbxassetid://110504679708488', path: 'InventoryAssetConfig.Slot_Legendary_5', desc: 'Золотая легендарная рамка слота.' },
      { name: 'Slot_Mythic_5', type: 'frames', rbxId: 'rbxassetid://138634223640319', path: 'InventoryAssetConfig.Slot_Mythic_5', desc: 'Красная мифическая рамка слота.' },
      { name: 'Slot_Secret', type: 'frames', rbxId: 'rbxassetid://125029706914658', path: 'InventoryAssetConfig.Slot_Secret', desc: 'Розовая секретная рамка слота.' },
    ];

    function renderAssets(filter) {
      const grid = document.getElementById('assetsGrid');
      grid.innerHTML = '';

      const items = filter === 'all' ? assetsData : assetsData.filter(a => a.type === filter);

      items.forEach(item => {
        let badgeClass = 'badge-sword';
        if (item.type === 'pets') badgeClass = 'badge-pet';
        if (item.type === 'mobs') badgeClass = 'badge-mob';
        if (item.type === 'frames') badgeClass = 'badge-frame';

        const card = document.createElement('div');
        card.className = 'asset-card';
        card.innerHTML = `
          <div class="card-header">
            <span class="asset-title">${item.name}</span>
            <span class="category-badge ${badgeClass}">${item.type}</span>
          </div>

          <p class="asset-desc">${item.desc}</p>
          <span style="font-size: 10px; color: #64748b;">Path: ${item.path}</span>

          <div class="rbx-id-box">
            <span class="rbx-id-text">${item.rbxId}</span>
            <button class="btn-copy" onclick="copyText('${item.rbxId}')">COPY</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAssets(cat);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert('Скопировано: ' + text);
    }

    // Init
    renderAssets('all');
  </script>
</body>
</html>
