<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Inventory 3D Viewport & Asset Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: #06080e;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0f1320;
      border-bottom: 1px solid #1e293b;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .location-tabs {
      display: flex;
      gap: 8px;
      background: #0a0c13;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #1e293b;
    }

    .tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
    }

    main {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 1:1 Roblox Inventory Slot Frame (Matching User's Screenshot 2) */
    .roblox-inventory-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at 50% 30%, #1e2438 0%, #0d101b 100%);
      border-radius: 14px;
      border: 2px solid var(--border-color, #2b3654);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 0, 0, 0.7);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s;
    }

    /* Outer Glow / Bevel Frame */
    .roblox-inventory-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    .roblox-inventory-card.selected {
      border-color: #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.5), inset 0 0 12px rgba(245, 158, 11, 0.2);
    }

    .roblox-inventory-card:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: #38bdf8;
    }

    /* 3D Model Canvas Viewport Placeholder */
    .viewport-3d-model {
      width: 80%;
      height: 80%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Stylized Roblox 3D Pet Character Renders */
    .mini-3d-character {
      width: 68px;
      height: 78px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.7));
      transition: transform 0.3s ease;
    }

    .roblox-inventory-card:hover .mini-3d-character {
      transform: scale(1.1) rotate(4deg);
    }

    .item-level-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .item-name-tag {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(6, 8, 14, 0.85);
      padding: 3px 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Detail Modal Sidebar */
    .inspector-detail-box {
      margin-top: 24px;
      background: #0d111c;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px 28px;
      max-width: 1200px;
      margin: 24px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .detail-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .detail-icon {
      width: 60px;
      height: 60px;
      background: #1e2438;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎒 Roblox 1:1 ViewportFrame Inventory & Pets Visualizer</h1>

    <div class="location-tabs">
      <button class="tab-btn active" onclick="switchCategory('pets', this)">Pets (Петы)</button>
      <button class="tab-btn" onclick="switchCategory('swords', this)">Weapons (Мечи)</button>
      <button class="tab-btn" onclick="switchCategory('skins', this)">Skins / Minions (Скины)</button>
    </div>
  </header>

  <main>
    <div class="inventory-grid" id="inventoryGrid">
      <!-- Populated dynamically -->
    </div>

    <div class="inspector-detail-box">
      <div class="detail-left">
        <div class="detail-icon" id="detailIcon">🐾</div>
        <div>
          <h2 style="font-family:'Fredoka',sans-serif; font-size: 18px; color:#fff;" id="detailName">Nightmare (3D Pet)</h2>
          <p style="font-size: 12px; color:#94a3b8;" id="detailSub">Rarity: Legendary | Power: x6.0 | Model: 2-C</p>
        </div>
      </div>
      <div>
        <span style="font-size:12px; color:#64748b;">Roblox ViewportFrame Implementation: <code style="color:#38bdf8;">ReplicatedStorage.PetModels["2-C"]</code></span>
      </div>
    </div>
  </main>

  <script>
    const rarityBorders = {
      'Common': '#3b4259',
      'Rare': '#2563eb',
      'Epic': '#9333ea',
      'Legendary': '#d97706',
      'Mythic': '#dc2626',
      'Secret': '#db2777'
    };

    // Vector 3D Character Renders (Replicating exact ViewportFrame look from User's Screenshot 2)
    const pet3DRenders = {
      'Woodling': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="18" y="24" width="28" height="36" rx="6" fill="#854d0e"/><rect x="22" y="10" width="20" height="20" rx="4" fill="#a16207"/><circle cx="28" cy="18" r="2.5" fill="#000"/><circle cx="36" cy="18" r="2.5" fill="#000"/><rect x="14" y="26" width="6" height="24" rx="3" fill="#854d0e"/><rect x="44" y="26" width="6" height="24" rx="3" fill="#854d0e"/><rect x="22" y="60" width="8" height="16" rx="4" fill="#713f12"/><rect x="34" y="60" width="8" height="16" rx="4" fill="#713f12"/></svg>`,
      'Lurk': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="18" y="24" width="28" height="36" rx="6" fill="#1e293b"/><rect x="22" y="10" width="20" height="20" rx="4" fill="#334155"/><circle cx="28" cy="18" r="2.5" fill="#ef4444"/><circle cx="36" cy="18" r="2.5" fill="#ef4444"/><polygon points="22,10 16,0 26,8" fill="#0f172a"/><polygon points="42,10 48,0 38,8" fill="#0f172a"/><rect x="22" y="60" width="8" height="16" rx="4" fill="#0f172a"/><rect x="34" y="60" width="8" height="16" rx="4" fill="#0f172a"/></svg>`,
      'Forestling': `<svg class="mini-3d-character" viewBox="0 0 64 80"><circle cx="32" cy="40" r="24" fill="#15803d"/><circle cx="25" cy="34" r="3" fill="#000"/><circle cx="39" cy="34" r="3" fill="#000"/><path d="M 26 44 Q 32 50 38 44" stroke="#000" stroke-width="2" fill="none"/></svg>`,
      'Hekata': `<svg class="mini-3d-character" viewBox="0 0 64 80"><circle cx="32" cy="40" r="24" fill="#581c87"/><circle cx="20" cy="36" r="3" fill="#a855f7"/><circle cx="32" cy="30" r="4" fill="#fde047"/><circle cx="44" cy="36" r="3" fill="#a855f7"/></svg>`,
      'Stiko': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="18" y="24" width="28" height="36" rx="6" fill="#d97706"/><rect x="22" y="10" width="20" height="20" rx="4" fill="#b45309"/><circle cx="28" cy="18" r="2.5" fill="#000"/><circle cx="36" cy="18" r="2.5" fill="#000"/><polygon points="22,10 16,0 26,8" fill="#b45309"/><polygon points="42,10 48,0 38,8" fill="#b45309"/><rect x="22" y="60" width="8" height="16" rx="4" fill="#78350f"/><rect x="34" y="60" width="8" height="16" rx="4" fill="#78350f"/></svg>`,
      'Charon': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="18" y="24" width="28" height="36" rx="6" fill="#c2410c"/><rect x="22" y="10" width="20" height="20" rx="4" fill="#ea580c"/><circle cx="28" cy="18" r="2.5" fill="#fff"/><circle cx="36" cy="18" r="2.5" fill="#fff"/><polygon points="22,10 16,0 26,8" fill="#9a3412"/><polygon points="42,10 48,0 38,8" fill="#9a3412"/><rect x="22" y="60" width="8" height="16" rx="4" fill="#9a3412"/><rect x="34" y="60" width="8" height="16" rx="4" fill="#9a3412"/></svg>`,
      'Morpheus': `<svg class="mini-3d-character" viewBox="0 0 64 80"><path d="M 8 36 Q 0 10 30 24 Q 0 62 8 36 Z" fill="#0284c7"/><path d="M 56 36 Q 64 10 34 24 Q 64 62 56 36 Z" fill="#0284c7"/><circle cx="32" cy="36" r="14" fill="#0369a1"/><circle cx="27" cy="34" r="2.5" fill="#fff"/><circle cx="37" cy="34" r="2.5" fill="#fff"/></svg>`,
      'Torn': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="18" y="24" width="28" height="36" rx="6" fill="#6b21a8"/><rect x="22" y="10" width="20" height="20" rx="4" fill="#7e22ce"/><circle cx="28" cy="18" r="2.5" fill="#ff0055"/><circle cx="36" cy="18" r="2.5" fill="#ff0055"/><polygon points="22,10 14,-2 26,8" fill="#581c87"/><polygon points="42,10 50,-2 38,8" fill="#581c87"/><rect x="22" y="60" width="8" height="16" rx="4" fill="#581c87"/><rect x="34" y="60" width="8" height="16" rx="4" fill="#581c87"/></svg>`,
      'Nifel': `<svg class="mini-3d-character" viewBox="0 0 64 80"><circle cx="32" cy="40" r="24" fill="#0369a1"/><path d="M 18 20 Q 12 0 26 12 Z" fill="#38bdf8"/><path d="M 46 20 Q 52 0 38 12 Z" fill="#38bdf8"/><circle cx="25" cy="34" r="3" fill="#38bdf8"/><circle cx="39" cy="34" r="3" fill="#38bdf8"/></svg>`,
      'Nightmare': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="18" y="24" width="28" height="36" rx="6" fill="#854d0e"/><rect x="22" y="10" width="20" height="20" rx="4" fill="#ca8a04"/><circle cx="28" cy="18" r="2.5" fill="#fff"/><circle cx="36" cy="18" r="2.5" fill="#fff"/><polygon points="20,10 12,-4 26,6" fill="#eab308"/><polygon points="44,10 52,-4 38,6" fill="#eab308"/><rect x="22" y="60" width="8" height="16" rx="4" fill="#78350f"/><rect x="34" y="60" width="8" height="16" rx="4" fill="#78350f"/></svg>`,
      'Grommash': `<svg class="mini-3d-character" viewBox="0 0 64 80"><rect x="16" y="20" width="32" height="42" rx="8" fill="#991b1b"/><rect x="20" y="6" width="24" height="22" rx="6" fill="#b91c1c"/><circle cx="27" cy="16" r="3" fill="#ff0055"/><circle cx="37" cy="16" r="3" fill="#ff0055"/><polygon points="20,6 10,-8 26,4" fill="#7f1d1d"/><polygon points="44,6 54,-8 38,4" fill="#7f1d1d"/><rect x="20" y="62" width="10" height="16" rx="4" fill="#7f1d1d"/><rect x="34" y="62" width="10" height="16" rx="4" fill="#7f1d1d"/></svg>`
    };

    const categories = {
      pets: [
        { name: 'Woodling', rarity: 'Common', power: 'x1.1', model: 'A' },
        { name: 'Lurk', rarity: 'Common', power: 'x1.2', model: 'B' },
        { name: 'Forestling', rarity: 'Rare', power: 'x1.35', model: 'C' },
        { name: 'Hekata', rarity: 'Rare', power: 'x1.5', model: 'D' },
        { name: 'Stiko', rarity: 'Legendary', power: 'x1.75', model: 'E' },
        { name: 'Charon', rarity: 'Rare', power: 'x1.75', model: 'F' },
        { name: 'Morpheus', rarity: 'Rare', power: 'x2.5', model: 'G' },
        { name: 'Torn', rarity: 'Epic', power: 'x3.33', model: '2-A' },
        { name: 'Nifel', rarity: 'Epic', power: 'x4.5', model: '2-B' },
        { name: 'Nightmare', rarity: 'Legendary', power: 'x6.0', model: '2-C' },
        { name: 'Grommash', rarity: 'Mythic', power: 'x8.0', model: '2-D' },
      ],
      swords: [
        { name: 'Wood Blade', rarity: 'Common', power: 'x1.0', model: 'W_Wood' },
        { name: 'Iron Rapier', rarity: 'Common', power: 'x1.5', model: 'W_Iron' },
        { name: 'Elven Katana', rarity: 'Rare', power: 'x3.0', model: 'W_Elven' },
        { name: 'Flame Greatsword', rarity: 'Epic', power: 'x8.5', model: 'W_Flame' },
        { name: 'Dragon Slayer', rarity: 'Legendary', power: 'x25.0', model: 'W_Dragon' },
        { name: 'Excalibur', rarity: 'Mythic', power: 'x120.0', model: 'W_Excalibur' },
      ],
      skins: [
        { name: 'Novice Armor', rarity: 'Common', power: 'x1.0', model: 'Minion1' },
        { name: 'Forest Ranger', rarity: 'Rare', power: 'x2.0', model: 'Minion2' },
        { name: 'Shadow Ninja', rarity: 'Epic', power: 'x5.0', model: 'Minion3' },
        { name: 'Royal King', rarity: 'Legendary', power: 'x15.0', model: 'Minion4' },
        { name: 'Valkyrie Queen', rarity: 'Mythic', power: 'x80.0', model: 'Minion5' },
      ]
    };

    function renderGrid(catKey) {
      const grid = document.getElementById('inventoryGrid');
      grid.innerHTML = '';

      const items = categories[catKey] || categories['pets'];
      items.forEach((item, idx) => {
        const bColor = rarityBorders[item.rarity] || '#3b4259';
        const svg = pet3DRenders[item.name] || pet3DRenders['Woodling'];

        const card = document.createElement('div');
        card.className = `roblox-inventory-card ${idx === 0 ? 'selected' : ''}`;
        card.style.setProperty('--border-color', bColor);
        card.onclick = () => selectItem(item, card);

        card.innerHTML = `
          <div class="item-level-tag">Lvl 1</div>
          <div class="viewport-3d-model">
            ${svg}
          </div>
          <div class="item-name-tag">${item.name}</div>
        `;
        grid.appendChild(card);
      });

      if (items.length > 0) {
        selectItem(items[0], grid.children[0]);
      }
    }

    function selectItem(item, cardEl) {
      document.querySelectorAll('.roblox-inventory-card').forEach(c => c.classList.remove('selected'));
      if (cardEl) cardEl.classList.add('selected');

      document.getElementById('detailName').textContent = `${item.name} (3D Viewport Model)`;
      document.getElementById('detailSub').textContent = `Rarity: ${item.rarity} | Power: ${item.power} | Model ID: ${item.model}`;
    }

    function switchCategory(catKey, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(catKey);
    }

    // Init
    renderGrid('pets');
  </script>
</body>
</html>
